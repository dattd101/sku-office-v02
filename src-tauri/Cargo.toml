[package]
name = "rust-office-modern"
version = "0.5.1"
edition = "2021"

[lib]
name = "rust_office_modern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
anyhow = "1"
calamine = "0.31"
rust_xlsxwriter = "0.79"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
uuid = { version = "1", features = ["v4", "serde"] }

# Isolate the Tauri crate from any Cargo.toml at repository root.
# Fixes: current package believes it is in a workspace when it is not.
[workspace]
resolver = "2"
